name: Reusable Build

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
    secrets:
      DEPLOY_TOKEN:
        description: 'Token used to authenticate to the deploy target'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Target: ${{ inputs.target }}"
          echo "Token length: ${#TOKEN}"
          echo "If you echo the token, GitHub auto-masks it: $TOKEN"
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
